CONFIG_FAT_FS=Y
CONFIG_VFAT_FS=Y
# Support UEFI+BLS-Spec paths
CONFIG_MSDOS_FS=N
# Disable legacy FAT_FS
CONFIG_FAT_DEFAULT_UTF8=n
CONFIG_FAT_DEFAULT_IOCHARSET="ascii"
# limits files created on the filesystem to 7-bit ASCII
# This ensures the FAT filesystem can only have esp-compatible filenames 
CONFIG_FAT_DEFAULT_CODEPAGE=437
# Dos codepage 437 is a 1:1 translation of ascii, for the first 128 characters
# This ensures the FAT filesystem can only have esp-compatible character encodings
CONFIG_NLS_CODEPAGE_437=y
# Embed support for the codepage into the kernel
# To ensure we can always mount FAT filesystems
