CONFIG_SECURITYFS=y
CONFIG_IMA=y

CONFIG_TCG_CRB=y
#Command Response Buffer (CRB)
#Mandatory for Intel PTT or AMD fTPM architectures built directly into modern CPUs

CONFIG_TCG_TIS=y
#TPM Interface Specification (TIS).
#Standard for almost all discrete x86 TPM chips connected via LPC or SPI buses

CONFIG_TCG_TPM2_HMAC=y
Forces AES-128-CFB session encryption between kernel/TPM to thwart physical bus-snooping 
CONFIG_KEYS=y
# Linux Kernel Key Retention Service.

CONFIG_TRUSTED_KEYS=y
#cryptographic keys that are wrapped/sealed by the TPM chip
