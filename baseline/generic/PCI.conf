CONFIG_PCI=y
# Enables baseline support for the PCI and PCI Express (PCIe) bus architecture 
CONFIG_SATA_AHCI=y
# Enables support for modern SATA hard drives and SSDs operating under the AHCI standard
CONFIG_PCIEPORTBUS=y
# Enables support for PCI Express (PCIe) port drivers, including advanced features like AER and PME
CONFIG_HOTPLUG_PCI=y 
# Enables support for inserting or removing PCI/PCIe cards while the system is running
